<div class="back-link">

  <a routerLink="/products">
    ← Back to Products
  </a>

</div>


@if (product$ | async; as product) {

  <mat-card class="product-details-card">

    <div class="product-image">

      <img
        [src]="product.thumbnail"
        [alt]="product.title"
      />

    </div>


    <div class="product-info">

      <h1>
        {{ product.title }}
      </h1>

      <p class="category">
        {{ product.category }}
      </p>

      <p class="description">
        {{ product.description }}
      </p>

      <p class="price">
        ₹{{ product.price }}
      </p>

      <p>
        Rating: {{ product.rating }}
      </p>

      <p>
        Stock: {{ product.stock }}
      </p>


      <div class="actions">

        <button
          matButton
          routerLink="/products"
        >
          Back to Products
        </button>

        <button matButton>
          Add to Cart
        </button>

      </div>

    </div>

  </mat-card>

}
