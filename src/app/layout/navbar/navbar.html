<mat-toolbar class="navbar">
  <button
    mat-icon-button
    aria-label="Open navigation"
    (click)="toggleMenu()"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="logo" routerLink="/dashboard">
    RxStore
  </span>

  <span class="spacer"></span>

  <button
    mat-icon-button
    aria-label="Compare products"
    routerLink="/compare"
    matTooltip="Compare Products"
  >
    <mat-icon>compare_arrows</mat-icon>
  </button>

  <button
    mat-icon-button
    aria-label="Shopping cart"
    routerLink="/cart"
  >
    @if ((cartCount$ | async) ?? 0; as count) {
      <mat-icon [matBadge]="count > 0 ? count : null" matBadgeColor="warn">
        shopping_cart
      </mat-icon>
    } @else {
      <mat-icon>shopping_cart</mat-icon>
    }
  </button>

  @if (isAuthenticated$ | async) {
    @if (user$ | async; as user) {
      <span class="user-name">{{ user.firstName }}</span>
    }
    <button
      mat-icon-button
      aria-label="User profile"
      routerLink="/profile"
    >
      <mat-icon>account_circle</mat-icon>
    </button>
    <button
      mat-icon-button
      aria-label="Logout"
      (click)="logout()"
    >
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <button
      mat-button
      routerLink="/auth"
    >
      <mat-icon>login</mat-icon>
      <span>Login</span>
    </button>
  }
</mat-toolbar>
